[package]
name = "fpdf"
version = "0.8.0"
edition = "2024"
build = "build.rs"
description = "A lightweight desktop PDF reader in Rust"
license = "MIT"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
libloading = "0.8.9"
lopdf = { version = "=0.45.0", default-features = false }
png = "0.18"
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
